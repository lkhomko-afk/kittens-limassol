<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="4 котёнка ищут дом в Лимассоле. Здоровы, обработаны от глистов, можно забрать сразу.">
<meta property="og:title" content="4 котёнка ищут дом · Лимассол">
<meta property="og:description" content="Здоровы, обработаны от глистов, можно забрать сразу. Пишите в WhatsApp или Telegram.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://lkhomko-afk.github.io/kittens-limassol/">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Котята ищут дом · Лимассол</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Layout: whitewashed Mediterranean page — short hero, 2×2 kitten cards, then terms + contact strip */
:root{
  --bg:#f6f9fb; --surface:#ffffff; --ink:#1d2b3a; --muted:#5b6b7b;
  --sea:#1f6fa8; --sea-soft:#e3eff8; --sun:#f2b33d; --line:#dbe5ee;
  --display:"Rubik",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#17232e; --ink:#e8eef4; --muted:#9db0c2;
  --sea:#6db3e6; --sea-soft:#1b3346; --sun:#f5c260; --line:#26394a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#17232e; --ink:#e8eef4; --muted:#9db0c2;
  --sea:#6db3e6; --sea-soft:#1b3346; --sun:#f5c260; --line:#26394a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.place{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:6px 14px;font:700 13px var(--body);cursor:pointer}
.lang:focus-visible,.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:800;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--sea)}
.hero p{margin:0;max-width:60ch;color:var(--muted);font-size:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sea-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip.sun{background:var(--sun);color:#2a1d00}

.hero-photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;max-height:460px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--sea-soft);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.photo svg{width:46%;height:auto}
.status{position:absolute;top:12px;left:12px;border-radius:999px;padding:4px 10px;font:700 12px var(--body);
  letter-spacing:.04em;text-transform:uppercase;background:var(--surface);color:var(--sea)}
.status.taken{background:var(--muted);color:var(--surface)}
.status.reserved{background:var(--sun);color:#2a1d00}
.info{padding:16px 18px 20px;display:flex;flex-direction:column;gap:8px}
.info h3{font-size:24px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;font-weight:600}
.info p{margin:0}

.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.box{border-top:3px solid var(--sea);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.box h2{font-size:22px}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.contact{background:var(--sea);color:#fff;border-radius:20px;padding:24px;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:space-between;gap:16px}
:root[data-theme="dark"] .contact{color:#0b1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{color:#0b1620}}
.contact h2{font-size:24px}
.contact .handle{font:700 20px var(--display);user-select:all}
.btn{background:var(--sun);color:#2a1d00;border:0;border-radius:12px;padding:12px 18px;font:800 15px var(--body);cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn.chat{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-size:16px;padding:13px 20px}
.btn.chat svg{width:22px;height:22px}
.btn.wa{background:#1f9d55}
.btn.tg{background:#2481cc}
.btn.chat:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;opacity:.85}
@media (max-width:520px){.actions{width:100%}.btn.chat{flex:1;justify-content:center}.btn.ghost{width:100%}}
.pair{margin:-16px 0 0;font-weight:700;color:var(--sea)}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.memo summary{font:700 18px var(--display);cursor:pointer}
.memo summary:focus-visible{outline:3px solid var(--sun);outline-offset:4px}
.memo ul{margin:12px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.share-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.share-row .note{flex:1 1 280px}
.btn.share{color:var(--sea);font-size:14px;padding:10px 16px}
.note{font-size:13px;color:var(--muted);margin:0}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span class="place" data-t="place"></span>
    <button class="lang" id="lang-toggle" type="button">EN</button>
  </div>

  <header class="hero">
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <div class="facts">
      <span class="chip" data-t="f1"></span>
      <span class="chip" data-t="f2"></span>
      <span class="chip" data-t="f4"></span>
      <span class="chip sun" data-t="f3"></span>
    </div>
    <img class="hero-photo" src="photos/box.jpg" alt="">
    <p class="note" data-t="namesNote"></p>
  </header>

  <section class="grid" id="kittens" aria-label="Котята"></section>

  <p class="pair" data-t="pair"></p>

  <section class="cols">
    <div class="box"><h2 data-t="getH"></h2><ul id="get"></ul></div>
    <div class="box"><h2 data-t="howH"></h2><ul id="how"></ul></div>
  </section>

  <details class="memo">
    <summary data-t="memoH"></summary>
    <ul id="memo"></ul>
  </details>

  <section class="box"><h2 data-t="termsH"></h2><ul id="terms"></ul></section>

  <section class="contact">
    <div>
      <h2 data-t="contactH"></h2>
      <div class="handle" id="handle"></div>
    </div>
    <div class="actions">
      <a class="btn chat wa" id="wa-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5 0a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>
        WhatsApp
      </a>
      <a class="btn chat tg" id="tg-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.4-.1-.5-.6-.2L6.5 13.3 1.8 11.8c-1-.3-1-1 .2-1.5L20.6 3.2c.9-.3 1.6.2 1.3 1.1Z"/></svg>
        Telegram
      </a>
      <button class="btn ghost" id="copy-btn" type="button" data-t="copy"></button>
    </div>
  </section>
  <div class="share-row">
    <p class="note" data-t="note"></p>
    <button class="btn ghost share" id="share-btn" type="button" data-t="share"></button>
  </div>
</div>

<script>
/* ====== ЗАПОЛНИТЕ ЭТО ======
   photo: путь к фото (например "tuchka.jpg") или "" — тогда рисуется силуэт нужного цвета
   status: "free" | "reserved" | "taken"                                         */
const CONTACT = "Telegram @corol_julia · +357 97 994 3406";
const WA_NUMBER = "35797994340" + "6";
const TG_USER = "corol_julia";
const WA_TEXT = { ru:"Здравствуйте! Я по поводу котят в Лимассоле 🐱", en:"Hi! I'm writing about the kittens in Limassol 🐱" };
const READY_FROM = { ru: "≈ 18 декабря", en: "≈ 18 December" };
const KITTENS = [
  { name:{ru:"Тигра",en:"Tigra"},     sex:null, color:{ru:"полосатый табби с белым",en:"tabby & white"}, fur:"#6b6258", photo:"photos/tabby.jpg", status:"free",
    about:{ru:"Внимательный взгляд, отлично позирует для фото.",en:"Curious eyes, a natural at posing for photos."} },
  { name:{ru:"Пятнашка",en:"Patch"},  sex:{ru:"девочка",en:"girl"}, color:{ru:"трёхцветная",en:"calico"}, fur:"#c9a27a", photo:"photos/calico.jpg", status:"free",
    about:{ru:"Самая пёстрая в компании: белая с рыжими и чёрными пятнами.",en:"The most colourful of the bunch: white with ginger and black patches."} },
  { name:{ru:"Рыжик",en:"Ginger"},    sex:null, color:{ru:"рыжий с белым",en:"ginger & white"}, fur:"#e08a3c", photo:"photos/ginger1.jpg", status:"free",
    about:{ru:"Чемпион по сну: сворачивается клубочком где угодно.",en:"Sleep champion: curls up anywhere."} },
  { name:{ru:"Персик",en:"Peach"},    sex:null, color:{ru:"рыжий с белым",en:"ginger & white"}, fur:"#e3a066", photo:"photos/box.jpg", status:"free",
    about:{ru:"Второй рыжик, любит спать в общей куче (на фото — все четверо).",en:"The second ginger, loves the family pile (all four in the photo)."} },
];
/* =========================== */

const T = {
  ru:{ place:"Лимассол · Кипр", title:"Четыре котёнка <em>ищут дом</em>",
      lead:"Им около 4 недель. Котята здоровы и уже получили средство от глистов. Забрать можно сразу. В этом возрасте их ещё докармливают смесью для котят и кашицей из паштета, мы всё покажем и расскажем. Ищем и постоянный дом, и передержку.",
      f1:"2 мальчика и 2 девочки", f2:"≈ 4 недели", f4:"Здоровы · обработаны от глистов", f3:"Можно забрать сразу",
      namesNote:"Имена временные, чтобы котят было проще различать. Настоящее имя дадите вы.",
      termsH:"Условия", howH:"Как забрать",
      terms:["Бесплатно","Когда котёнок подрастёт, его нужно будет стерилизовать (в 5–6 месяцев)","Если не сложится, напишите нам: заберём обратно или поможем пристроить"],
      pair:"Вдвоём котятам теплее и спокойнее. Можно взять парой.",
      getH:"Что вы получите",
      get:["Смесь и паштет на первые дни","Короткую памятку по уходу (ниже)","Нашу поддержку в чате, если появятся вопросы"],
      memoH:"Памятка: как ухаживать за котёнком в 4 недели",
      memo:["Смесь для котят (KMR или Royal Canin Babycat Milk) каждые 4–5 часов, тёплую. Коровье молоко нельзя.","3–4 раза в день чайная ложка паштета для котят, размятого со смесью.","Тепло: место без сквозняков и грелка под половиной лежанки.","Плоский лоток. После еды сажайте в него котёнка.","Вялость, отказ от еды, понос или гноящиеся глаза — сразу к ветеринару."],
      share:"Поделиться ссылкой", shared:"Ссылка скопирована",
      how:["Напишите, какой котёнок понравился","Договоримся о встрече, можно уже сегодня","Покажем, как кормить и ухаживать","Забираете котёнка вместе с запасом смеси"],
      contactH:"Пишите, если хотите котёнка", copy:"Скопировать контакт", copied:"Скопировано",
      status:{free:"Свободен",reserved:"Забронирован",taken:"Уже дома"},
      note:"Пожалуйста, перешлите эту страницу знакомым в Лимассоле — так котята найдут дом быстрее." },
  en:{ place:"Limassol · Cyprus", title:"Four kittens <em>need a home</em>",
      lead:"They're about 4 weeks old, healthy and already dewormed. Ready to go now. At this age they still need kitten milk formula and mashed wet food, and we'll show you exactly how. Looking for forever homes or foster carers.",
      f1:"2 boys & 2 girls", f2:"≈ 4 weeks old", f4:"Healthy · dewormed", f3:"Ready to go now",
      namesNote:"The names are temporary nicknames so you can tell them apart. You'll choose the real one.",
      termsH:"Terms", howH:"How to adopt",
      terms:["Free","Neutering once they're old enough (5–6 months)","If it doesn't work out, message us: we'll take the kitten back or help rehome"],
      pair:"Kittens are warmer and calmer in twos. Adopting a pair is welcome.",
      getH:"What you get",
      get:["Formula and wet food for the first days","A short care guide (below)","Our support in chat for any questions"],
      memoH:"Care guide: a 4-week-old kitten",
      memo:["Kitten milk formula (KMR or Royal Canin Babycat Milk) every 4–5 hours, warm. No cow's milk.","3–4 times a day, a teaspoon of kitten pâté mashed with formula.","Warmth: a draught-free spot with a heat pad under half the bed.","A shallow litter tray. Put the kitten in it after meals.","Lethargy, not eating, diarrhoea or sticky eyes: see a vet right away."],
      share:"Share link", shared:"Link copied",
      how:["Message us with the kitten you like","Arrange a visit, even today","We show you how to feed and care for them","Take your kitten home with a starter supply of formula"],
      contactH:"Message us to adopt", copy:"Copy contact", copied:"Copied",
      status:{free:"Available",reserved:"Reserved",taken:"Adopted"},
      note:"Please share this page with friends in Limassol — it helps the kittens find homes faster." }
};

const catSVG = c => `<svg viewBox="0 0 120 110" aria-hidden="true">
  <path d="M18 8 L44 34 L76 34 L102 8 L106 62 Q106 104 60 104 Q14 104 14 62 Z" fill="${c}"/>
  <ellipse cx="42" cy="62" rx="8" ry="10" fill="#fff"/><ellipse cx="78" cy="62" rx="8" ry="10" fill="#fff"/>
  <circle cx="43" cy="64" r="5" fill="#1d2b3a"/><circle cx="79" cy="64" r="5" fill="#1d2b3a"/>
  <path d="M55 78 L65 78 L60 84 Z" fill="#f29bb0"/></svg>`;

/* Две версии одной страницы: ссылка с #ru или #en открывает нужный язык */
const fromHash = () => (location.hash === "#en" || location.hash === "#ru") ? location.hash.slice(1) : null;
let lang = fromHash() || "ru";
if (!fromHash()) { try { lang = localStorage.getItem("kit-lang") || "ru"; } catch(e) {} }
window.addEventListener("hashchange", () => { const h = fromHash(); if (h && h !== lang) { lang = h; render(); } });

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t[el.dataset.t]);
  document.getElementById("terms").innerHTML = t.terms.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("how").innerHTML = t.how.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("get").innerHTML = t.get.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("memo").innerHTML = t.memo.map(x=>`<li>${x}</li>`).join("");
  document.getElementById("handle").textContent = CONTACT;
  document.getElementById("wa-btn").href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(WA_TEXT[lang])}`;
  document.getElementById("tg-btn").href = `https://t.me/${TG_USER}`;
  document.getElementById("lang-toggle").textContent = lang === "ru" ? "EN" : "RU";
  document.getElementById("kittens").innerHTML = KITTENS.map(k => `
    <article class="card">
      <div class="photo">
        ${k.photo ? `<img src="${k.photo}" alt="${k.name[lang]}">` : catSVG(k.fur)}
        <span class="status ${k.status}">${t.status[k.status]}</span>
      </div>
      <div class="info">
        <h3>${k.name[lang]}</h3>
        <div class="meta">${k.sex ? `<span>${k.sex[lang]}</span>` : ""}<span>${k.color[lang]}</span></div>
        <p>${k.about[lang]}</p>
      </div>
    </article>`).join("");
}

document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("kit-lang", lang); } catch(e) {}
  try { history.replaceState(null, "", "#" + lang); } catch(e) {}
  render();
});
document.getElementById("copy-btn").addEventListener("click", e => {
  const btn = e.currentTarget;
  navigator.clipboard.writeText(CONTACT).then(() => {
    btn.textContent = T[lang].copied;
    setTimeout(() => btn.textContent = T[lang].copy, 1800);
  }).catch(() => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("handle"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
const SHARE_URL = "https://lkhomko-afk.github.io/kittens-limassol/";
document.getElementById("share-btn").addEventListener("click", async e => {
  const btn = e.currentTarget, url = SHARE_URL + "#" + lang;
  try {
    if (navigator.share) { await navigator.share({ title: document.title, url }); return; }
  } catch (err) { if (err && err.name === "AbortError") return; }
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = T[lang].shared;
    setTimeout(() => btn.textContent = T[lang].share, 1800);
  } catch (err) { btn.textContent = url; }
});
render();
</script>

</body>
</html>
