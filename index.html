<!doctype html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Котята ищут дом · Лимассол</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: whitewashed Mediterranean page — hero with group photo, 2×2 kitten cards with one-tap message, honest care note, contact strip */
:root{
  --bg:#f6f9fb; --surface:#ffffff; --ink:#1d2b3a; --muted:#5b6b7b;
  --sea:#1f6fa8; --sea-soft:#e3eff8; --sun:#f2b33d; --sun-soft:#fdf1d8; --line:#dbe5ee;
  --display:"Rubik",system-ui,sans-serif; --body:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#17232e; --ink:#e8eef4; --muted:#9db0c2;
  --sea:#6db3e6; --sea-soft:#1b3346; --sun:#f5c260; --sun-soft:#3a2f17; --line:#26394a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#17232e; --ink:#e8eef4; --muted:#9db0c2;
  --sea:#6db3e6; --sea-soft:#1b3346; --sun:#f5c260; --sun-soft:#3a2f17; --line:#26394a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
.wrap{max-width:980px;margin:0 auto;padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:36px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.place{font:700 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.updated{font-size:13px;color:var(--muted);margin-left:10px;font-weight:600}
.lang{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
  padding:6px 14px;font:700 13px var(--body);cursor:pointer}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.hero{display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(32px,6vw,54px);font-weight:800;line-height:1.05}
.hero h1 em{font-style:normal;color:var(--sea)}
.hero p{margin:0;max-width:62ch;color:var(--muted);font-size:18px}
.facts{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--sea-soft);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px}
.chip.sun{background:var(--sun);color:#2a1d00}
.hero-photo{width:100%;max-width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:20px;max-height:460px}
.note{font-size:13px;color:var(--muted);margin:0}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;max-width:100%;display:grid;place-items:center;background:var(--sea-soft);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.status{position:absolute;top:12px;left:12px;border-radius:999px;padding:4px 10px;font:800 12px var(--body);
  letter-spacing:.04em;text-transform:uppercase;background:var(--surface);color:var(--sea)}
.status.taken{background:var(--muted);color:var(--surface)}
.status.reserved{background:var(--sun);color:#2a1d00}
.info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.info h3{font-size:24px;font-weight:700}
.meta{color:var(--muted);font-size:15px;font-weight:600}
.want{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:8px;text-decoration:none;
  background:var(--sea);color:#fff;border-radius:12px;padding:10px 16px;font:800 15px var(--body)}
:root[data-theme="dark"] .want{color:#0b1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .want{color:#0b1620}}
.want:hover{filter:brightness(1.08)}

.care{background:var(--sun-soft);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.care h2{font-size:22px}
.care p{margin:0;max-width:70ch}
.memo summary{font:700 16px var(--display);cursor:pointer;color:var(--ink)}
.memo ul{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}
.box{border-top:3px solid var(--sea);padding-top:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h2{font-size:22px}
.box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}

.contact{background:var(--sea);color:#fff;border-radius:20px;padding:24px;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:space-between;gap:16px}
:root[data-theme="dark"] .contact{color:#0b1620}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .contact{color:#0b1620}}
.contact h2{font-size:24px}
.contact .handle{font:700 20px var(--display);user-select:all}
.contact .safe{font-size:14px;opacity:.9;margin:6px 0 0;max-width:46ch}
.btn{background:var(--sun);color:#2a1d00;border:0;border-radius:12px;padding:12px 18px;font:800 15px var(--body);cursor:pointer}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn.chat{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font-size:16px;padding:13px 20px}
.btn.chat svg{width:22px;height:22px}
.btn.wa{background:#1f9d55}
.btn.tg{background:#2481cc}
.btn.chat:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:inherit;border:2px solid currentColor;opacity:.85}
@media (max-width:520px){.actions{width:100%}.btn.chat{flex:1;justify-content:center}.btn.ghost{width:100%}}
.share{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.share .note{flex:1 1 280px}
.share .btn{background:var(--surface);color:var(--sea);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <span><span class="place" data-t="place"></span><span class="updated" data-t="updated"></span></span>
    <button class="lang" id="lang-toggle" type="button">EN</button>
  </div>

  <header class="hero">
    <h1 data-t="title"></h1>
    <p data-t="lead"></p>
    <div class="facts">
      <span class="chip" data-t="f1"></span>
      <span class="chip" data-t="f2"></span>
      <span class="chip" data-t="f4"></span>
      <span class="chip sun" data-t="f3"></span>
    </div>
    <img class="hero-photo" src="photos/box.jpg" alt="">
    <p class="note" data-t="namesNote"></p>
  </header>

  <section class="grid" id="kittens" aria-label="Котята"></section>

  <section class="care">
    <h2 data-t="careH"></h2>
    <p data-t="careP"></p>
    <p data-t="fosterP"></p>
    <details class="memo">
      <summary data-t="memoH"></summary>
      <ul id="memo"></ul>
    </details>
  </section>

  <section class="cols">
    <div class="box"><h2 data-t="howH"></h2><ul id="how"></ul></div>
    <div class="box"><h2 data-t="termsH"></h2><ul id="terms"></ul></div>
  </section>

  <section class="contact">
    <div>
      <h2 data-t="contactH"></h2>
      <div class="handle" id="handle"></div>
      <p class="safe" data-t="safe"></p>
    </div>
    <div class="actions">
      <a class="btn chat wa" id="wa-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5 0a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3Z"/></svg>
        WhatsApp
      </a>
      <a class="btn chat tg" id="tg-btn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.7 19.5c-.2 1-.9 1.3-1.7.8l-4.8-3.5-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.4-.1-.5-.6-.2L6.5 13.3 1.8 11.8c-1-.3-1-1 .2-1.5L20.6 3.2c.9-.3 1.6.2 1.3 1.1Z"/></svg>
        Telegram
      </a>
      <button class="btn ghost" id="copy-btn" type="button" data-t="copy"></button>
    </div>
  </section>

  <div class="share">
    <p class="note" data-t="note"></p>
    <button class="btn" id="share-btn" type="button" data-t="shareBtn"></button>
  </div>
</div>

<script>
/* ====== ДАННЫЕ ======
   Здесь только то, что известно точно. Пол каждого котёнка не указан, пока его не проверят.
   status: "free" | "reserved" | "taken"                                         */
const CONTACT = "Telegram @corol_julia · +357 97 943406";
const WA_NUMBER = "357" + "97943406";
const TG_USER = "corol_julia";
const SHARE_URL = "https://lkhomko-afk.github.io/kittens-limassol/";
const UPDATED = { ru: "обновлено 20 ноября", en: "updated 20 Nov" };
const KITTENS = [
  { name:{ru:"Тигра",en:"Tigra"},    color:{ru:"полосатый с белым",en:"tabby & white"},  photo:"photos/tabby.jpg",   status:"free" },
  { name:{ru:"Пятнашка",en:"Patch"}, color:{ru:"трёхцветный",en:"calico"},         photo:"photos/calico.jpg",  status:"free" },
  { name:{ru:"Рыжик",en:"Ginger"},   color:{ru:"рыжий с белым",en:"ginger & white"},     photo:"photos/ginger1.jpg", status:"free" },
  { name:{ru:"Персик",en:"Peach"},   color:{ru:"рыжий с белым · на общем фото",en:"ginger & white · in the group photo"}, photo:"photos/box.jpg", status:"free" },
];
/* ==================== */

const T = {
  ru:{ place:"Лимассол · Кипр", updated:UPDATED.ru, title:"Четыре котёнка <em>ищут дом</em>",
      lead:"Котятам меньше месяца. Они в целом здоровы, им дали таблетки от глистов. Забрать можно сразу. Ищем постоянный дом.",
      f1:"2 мальчика и 2 девочки", f2:"меньше месяца", f4:"дали таблетки от глистов", f3:"Можно забрать сразу",
      namesNote:"Имена временные, чтобы котят было проще различать. Кто из них мальчик, а кто девочка, пока не определяли.",
      careH:"Их ещё нужно докармливать",
      careP:"В этом возрасте котёнок пьёт смесь для котят каждые 3–5 часов и понемногу начинает есть размятый паштет. Ему нужны тепло и низкий лоток. Так будет ещё 2–3 недели, поэтому лучше, если кто-то часто бывает дома.",
      fosterP:"<b>Можно парой</b>: вдвоём котятам теплее и спокойнее.",
      memoH:"Памятка по уходу",
      memo:["Смесь для котят (например, KMR или Royal Canin Babycat Milk), тёплая, каждые 4–5 часов, а маленьким и слабым каждые 3–4 часа. Ночью перерыв не больше 5 часов. Коровье молоко нельзя.","3–4 раза в день можно предлагать чайную ложку паштета для котят, размятого со смесью. Не ест, не страшно: главное смесь.","Тёплое место без сквозняков. Грелка под половиной лежанки, через полотенце и на слабом режиме.","Низкий лоток с некомкующимся наполнителем (бумажным или древесным). После еды посадите котёнка в него.","Вялость, отказ от еды, понос, гноящиеся глаза: сразу к ветеринару."],
      howH:"Как забрать",
      how:["Нажмите «Написать» под котёнком, откроется WhatsApp с готовым сообщением","Допишите пару слов о себе: где живёте, были ли раньше кошки","Договоримся о встрече, можно уже сегодня"],
      termsH:"Условия",
      terms:["Бесплатно","Котёнок живёт дома, а не на улице"],
      contactH:"Пишите, если хотите котёнка", copy:"Скопировать контакт", copied:"Скопировано",
      safe:"Мы не берём денег и не просим предоплату. Если кто-то просит деньги за этих котят, это не мы.",
      status:{free:"Ищет дом",reserved:"Бронь",taken:"Уже дома"},
      want:n=>`Написать · ${n}`, waKitten:n=>`Здравствуйте! Я по поводу котёнка по имени ${n} в Лимассоле. Пара слов о себе: `,
      waGeneral:"Здравствуйте! Я по поводу котят в Лимассоле. Пара слов о себе: ",
      note:"Не можете взять котёнка? Перешлите страницу знакомым в Лимассоле, это очень помогает.",
      shareBtn:"Поделиться ссылкой", shareDone:"Ссылка скопирована" },
  en:{ place:"Limassol · Cyprus", updated:UPDATED.en, title:"Four kittens <em>need a home</em>",
      lead:"The kittens are under a month old. They're generally healthy and have been given deworming tablets. Ready to go now. Looking for forever homes.",
      f1:"2 boys & 2 girls", f2:"under a month old", f4:"given deworming tablets", f3:"Ready to go now",
      namesNote:"The names are temporary nicknames so you can tell them apart. We haven't checked yet which kitten is a boy or a girl.",
      careH:"They still need formula feeds",
      careP:"At this age a kitten drinks kitten milk formula every 3–5 hours and is starting on mashed wet food. It needs warmth and a low litter tray. This lasts another 2–3 weeks, so it helps if someone is home a lot.",
      fosterP:"<b>Pairs welcome</b>: two kittens keep each other warm and calm.",
      memoH:"Care guide",
      memo:["Kitten milk formula (e.g. KMR or Royal Canin Babycat Milk), warm, every 4–5 hours (every 3–4 hours for small or weak kittens). At night, no more than 5 hours between feeds. No cow's milk.","3–4 times a day you can offer a teaspoon of kitten pâté mashed with formula. If it's not interested yet, formula is enough.","A warm, draught-free spot. A heat pad under half the bed, wrapped in a towel, on low.","A low tray with non-clumping litter (paper or wood pellets). Put the kitten in it after meals.","Lethargy, not eating, diarrhoea or sticky eyes: see a vet right away."],
      howH:"How to adopt",
      how:["Tap “Message” under a kitten to open WhatsApp with a ready message","Add a line about yourself: where you live, whether you've had cats","We'll arrange a visit, as early as today"],
      termsH:"Terms",
      terms:["Free","An indoor home, not left outside"],
      contactH:"Message us to adopt", copy:"Copy contact", copied:"Copied",
      safe:"We never ask for money or a deposit. If someone asks you to pay for these kittens, it isn't us.",
      status:{free:"Available",reserved:"Reserved",taken:"Adopted"},
      want:n=>`Message about ${n}`, waKitten:n=>`Hi! I'm writing about ${n}, the kitten in Limassol. A bit about me: `,
      waGeneral:"Hi! I'm writing about the kittens in Limassol. A bit about me: ",
      note:"Can't take a kitten? Please share this page with friends in Limassol. It really helps.",
      shareBtn:"Share link", shareDone:"Link copied" }
};

const wa = text => `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(text)}`;
const list = (id, items) => document.getElementById(id).innerHTML = items.map(x=>`<li>${x}</li>`).join("");

/* Язык: ссылка с #ru / #en → выбор, сделанный кнопкой → язык устройства (русский → ru, любой другой → en) */
const fromHash = () => (location.hash === "#en" || location.hash === "#ru") ? location.hash.slice(1) : null;
const fromDevice = () => {
  const langs = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || ""];
  return String(langs[0] || "").toLowerCase().startsWith("ru") ? "ru" : "en";
};
let saved = null;
try { const s = localStorage.getItem("kit-lang"); if (s === "ru" || s === "en") saved = s; } catch(e) {}
let lang = fromHash() || saved || fromDevice();
window.addEventListener("hashchange", () => { const h = fromHash(); if (h && h !== lang) { lang = h; render(); } });

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.innerHTML = t[el.dataset.t]);
  list("terms", t.terms); list("how", t.how); list("memo", t.memo);
  document.getElementById("handle").textContent = CONTACT;
  document.getElementById("wa-btn").href = wa(t.waGeneral);
  document.getElementById("tg-btn").href = `https://t.me/${TG_USER}`;
  document.getElementById("lang-toggle").textContent = lang === "ru" ? "EN" : "RU";
  document.getElementById("kittens").innerHTML = KITTENS.map(k => `
    <article class="card">
      <div class="photo">
        <img src="${k.photo}" alt="${k.name[lang]}">
        <span class="status ${k.status}">${t.status[k.status]}</span>
      </div>
      <div class="info">
        <h3>${k.name[lang]}</h3>
        <div class="meta">${k.color[lang]}</div>
        ${k.status === "taken" ? "" : `<a class="want" href="${wa(t.waKitten(k.name[lang]))}" target="_blank" rel="noopener">${t.want(k.name[lang])}</a>`}
      </div>
    </article>`).join("");
}

function flash(btn, done, reset){ btn.textContent = done; setTimeout(() => btn.textContent = reset(), 1800); }

document.getElementById("lang-toggle").addEventListener("click", () => {
  lang = lang === "ru" ? "en" : "ru";
  try { localStorage.setItem("kit-lang", lang); } catch(e) {}
  try { history.replaceState(null, "", "#" + lang); } catch(e) {}
  render();
});
document.getElementById("copy-btn").addEventListener("click", e => {
  const btn = e.currentTarget;
  navigator.clipboard.writeText(CONTACT).then(() => flash(btn, T[lang].copied, () => T[lang].copy)).catch(() => {
    const r = document.createRange(); r.selectNodeContents(document.getElementById("handle"));
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  });
});
document.getElementById("share-btn").addEventListener("click", async e => {
  const btn = e.currentTarget, url = SHARE_URL + "#" + lang;
  try { if (navigator.share) { await navigator.share({ title: document.title, url }); return; } }
  catch (err) { if (err && err.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(url); flash(btn, T[lang].shareDone, () => T[lang].shareBtn); }
  catch (err) { btn.textContent = url; }
});
render();
</script>

</body>
</html>
